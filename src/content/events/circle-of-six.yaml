details:
  - Welcome to “Circle of Six”, hosted by Rising Sound WA, an event showcasing original songwriters in a literal songwriters round, featuring a soloist, a duo and a trio of artists all bringing their stories behind the music and the music itself to a closed audience. The event will be intimate and unplugged with doors closing at 6pm for two sessions, broken up by an intermission.
  - Solo - Zoe Eleni is a singer songwriter based in the Perth hills with a passion for folk music, story telling and pretty guitar sounds.
  - Inspired by songstresses like Joni Mitchell, Connie Converse and Laura Marling, Zoe’s music is sometimes sad, sometimes funny, sometimes catchy, always honest.
  - She performs with warmth, banter and a little bit of awkwardness sure to endear you.
  - Duo - The Bloody Lovelies, featuring Kyra Bee and Siân Johanna, two of Perth’s biggest female voices come together with their original and gritty songwriting, woven with intricate melodies and soaring harmonies. Inspired by experiences in love, loss and family, their musical stories will move you, they're just soooo bloody lovely.
  - The Pointy Heads - The Pointy Heads believe in dressing dapper while filling the room with a bit of that old timey-sound that is energetic and fun. Their influences range from Tom Waits to C.W. Stoneking and Bruce Springsteen and everything inbetween.
  - Midland Junction Arts Centre is a licensed venue and the bar will be open, before and during the event.
  - This is a closed door event. Doors open at 5.30. Come in, mingle, grab a drink but at 5.59, doors will close and we ask that audiences remain seated and quiet during the sessions. There will be a half hour intermission at 7pm.
