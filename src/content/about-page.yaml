eyebrow: About
heading: Formed by musicians, for musicians.
lead: Rising Sound WA Inc. is a not-for-profit incorporated association supporting original musical and performance works across Western Australia.
paragraphs:
- We put on concerts in venues, halls, parks and unexpected spaces, take events to towns outside the city, film short-form sessions with original performers, and match musicians with stages that suit them.
- Everything runs on members, volunteers and the venues that lend us their rooms.
pullQuote: Atmosphere matters. Original work matters. Both deserve more care than they usually get.
image: /assets/img-singer.jpg
imageAlt: A performer on the shop floor at Midland Records
imageCaption: Saturday Sessions · Midland Records, Midland
valuesHeading: What we hold to
values:
- title: Community
  body: The room matters as much as the bill.
- title: Craft
  body: Sound, light and staging done properly.
- title: Original work
  body: A place for original songs, where many rooms only want covers.
- title: Care
  body: Artists paid, audiences looked after.
- title: Local first
  body: We encourage WA artists, and welcome acts from further afield.
committeeHeading: Who runs it
committeeIntro: Rising Sound WA is governed by a volunteer committee of musicians, organisers and community board members.
