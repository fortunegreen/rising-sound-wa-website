name: Mark Phillips
order: 4
role: Committee member
photo: /assets/mark-phillips/committee-mark-phillips.jpg
bio:
- Born in the UK, Mark has been a lifelong music lover and collector in all its physical formats. That passion led him into artist management and music promotion in London during the early 2000s, before later making Perth home.
- These days, Mark is the presenter of The Mixtape Podcast & Radio Show on Radio Fremantle, where for the past four years he's interviewed hundreds of international and Australian artists while championing Western Australia's music scene.
- Away from the studio, Mark records live acoustic sessions with local musicians, curates shows for Sofar Sounds Boorloo/Perth and MCs at the Nannup Music Festival. Through his broadcasting, content creation and social media work, he's passionate about giving artists a platform to share their music and stories with new audiences.
- Whether he's behind a microphone, behind a camera or standing side of stage, Mark's goal has always been the same – supporting artists and helping Western Australia's music community continue to thrive.
