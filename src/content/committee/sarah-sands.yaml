name: Sarah Sands
order: 5
role: Committee member
photo: committee-sarah-mason-durack.jpg
bio:
  - For Sarah Sands, her musical roots run deep, passed on from her father, Perth country stalwart, Gene Sands, and through her numerous WAM winning siblings. After bouncing between various bands through her 20s and 30s, from jazz to rock, Sands is forging ahead with her true love of country music in The Stumblers.
  - No longer content to wait around for offers, she has decided to create the gigs she wants to play and wants to attend. With a specific focus on WA Country artists, Sands is assembling events across the State, from Maylands to Merredin, and is determined to bring quality music to every corner of WA, with all the sparkle and rhinestones that goes along with it.
