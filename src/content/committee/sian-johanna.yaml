name: Siân Johanna
order: 2
role: Chief Executive Officer
photo: committee-sian.jpg
bio:
  - Siân Johanna is the founding Chief Executive Officer of Rising Sound WA and leads its programming. She is a working musician who played alongside Jon Elbery in several long-running Perth Hills bands, and she founded Ladybird Music, a business spanning recording, tuition, promotion and events.
  - Frustrated that hearing good original music meant driving down the hill, she began building it where she lived. Live at the Kala, a monthly line-up at the Kalamunda Hotel, was followed by the Summer Sundowner at Araluen and Live at the Spire, among others. The audiences were there; what she wanted next was better pay and larger opportunities for the artists. Rising Sound WA was established with Jon Elbery to provide them.
  - She now curates the Saturday Sessions at Midland Records and the Rising Sound Sessions film series, and is developing the organisation's next programs.
