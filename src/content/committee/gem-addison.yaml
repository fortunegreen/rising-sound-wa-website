name: Gem Addison
order: 6
role: Committee member
photo: /assets/gem-addison/committee-gem-addison.jpg
bio:
- Meet Gem Addison, our fabulous digital creator and long running member of the organisation.
- Gem was first exposed to live music at the age of 3 at Fairbridge Festival and has been playing music for nearly 10 years. Gem started playing her original music at Nanga Music Festival as part of the youth scholarship programme.
- A highlight of her musical career was playing to 10,000 people at a school strike for climate change rally.
- Gem met Jon Elbery and Mo Johanna in 2018 at Kalamunda’s Hillsounds, when she performed with her fledgling jazz band, Freehand, with her teal green hair, warm smile and personality, they formed some lasting friendships, with a mutual passion for bringing music to the Perth Hills and surrounds.
- Gem is currently gigging around Perth as one half of the fabulous folk duo, Charlie & Goldie.
- With a passion for graphic design, Gem noticed music and design were mutually related and her skills were advantageous in creating promo material which lead her to her role in Rising Sound.
- Gem loves long walks in the forest, birds and animals…
