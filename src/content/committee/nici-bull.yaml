name: Nici Bull
order: 3
role: Committee member
photo: committee-nici-bull.jpg
bio:
  - Nici Bull is a Perth hills based singer songwriter. She started playing music in the early 2000s. Nici has been involved in a number of bands over the years, most notably as the backing vocalist and percussionist for award winning artist Delilah Rose.
  - In the last 5 years Nici has stepped forward in a solo capacity. She has released 4 singles with her latest single, “Lavender Lover”, recently released at Clancy's Fremantle.
  - She is a regular performer within Perth and Fremantle and has performed at a number of WA festivals including Nanga Music Festival, Wild Village Festival and Nannup Music Festival.
  - As well as this Nici is the curator of the gig series Season Songbirds. A women centred gig series, that seeks to showcase the extraordinary creative talent we have in both music and visual arts within Western Australia.
  - Nici is a gun behind the scenes, using her knowledge and connections to forge amazing opportunities for all the members to get behind. She is a valued member of Rising Sound and we appreciate her presence and contributions.
