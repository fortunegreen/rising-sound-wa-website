name: Jon Elbery
order: 1
role: Chair
photo: committee-jon-elbery.jpg
bio:
  - Jon Elbery chairs Rising Sound WA, bringing governance experience from a career as a public company director to a volunteer-run arts organisation. He retired from company directorship some years ago and now chairs the Kalamunda Chamber of Commerce, co-chairs Kalamunda Community Matters, and sits on the board of the Bullwinkel Business Alliance.
  - A drummer who began playing in London, Jon has spent a lifetime in and around live music as a performer and audience member. He settled in the Kalamunda region, where he has built the bands, friendships and community relationships that Rising Sound WA still draws on.
  - "Within the organisation Jon is responsible for turning programming ideas into delivered events: governance, reporting, compliance and the administration that sits behind every show. He remains committed to enriching the Perth music scene and to putting more original WA artists in front of audiences."
